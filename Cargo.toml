[package]
name = "rdpweb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
ironrdp = { version = "0.17", features = ["connector", "dvc", "graphics", "session", "svc"] }
ironrdp-egfx = "0.3"
ironrdp-tls = { version = "0.2", features = ["rustls-ring"] }
ironrdp-tokio = { version = "0.10", features = ["reqwest-rustls-ring"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
toml = "1"

[dev-dependencies]
async-trait = "0.1"
ironrdp-server = { version = "0.13", default-features = false, features = ["egfx", "helper"] }
